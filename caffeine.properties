# CaffeineCitrix64 Configuration File
# 
# Mode:
#   F15 (Default) - Sends VK_F15 virtual key press/release (reliable, does not steal focus / WM_ACTIVATE).
#   MouseMove     - Sends WM_MOUSEMOVE message to top-left corner (1,1) without moving physical cursor.
UseMouseMoveOnly=False
Mode=F15

# TargetKeywords:
#   Comma-, semicolon-; or pipe-| separated process name keywords to match (case-insensitive).
#   Includes Citrix Workspace (wfica, cdviewer, citrix) and Windows App / RDP (msrdc, remotedesktop, desktopviewer).
TargetKeywords=wfica,cdviewer,citrix,msrdc,remotedesktop,desktopviewer
